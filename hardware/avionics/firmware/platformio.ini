[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32 @ 8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; Ebyte E32-433T30D transmitter, UART 9600 8N1.
; Wiring TX terbaru: AUX=D27/GPIO27, aktif; M0=GPIO25, M1=GPIO26.
; POP_TEST_IN tetap dinonaktifkan pada TX.
build_flags =
    -DE32_AUX_PIN=27
    -DBOARD_POP_TEST_INPUT_PIN=-1
; Untuk pengujian tanpa AUX, ubah E32_AUX_PIN menjadi -1.
lib_deps =
    adafruit/Adafruit BMP280 Library @ 3.0.0
; Jika deteksi port otomatis gagal, isi sesuai hasil ./firmware.sh ports:
; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0

; Tes kabel GPIO17 TX -> GPIO16 RX, tanpa modul/AUX; MPU tetap dibaca.
[env:uart_direct]
extends = env:esp32dev
build_flags =
    -DE32_AUX_PIN=-1
    -DBOARD_POP_TEST_INPUT_PIN=-1
    -DUART_DIRECT_TEST=1

; Setup parameter E32 tersimpan lewat ESP32, tanpa pembacaan sensor.
[env:e32_setup]
extends = env:esp32dev
build_src_filter = -<*> +<e32_setup.cpp>
lib_deps =
build_flags =
    -DE32_AUX_PIN=27
    -DBOARD_POP_TEST_INPUT_PIN=-1
    -DE32_SETUP_BUILD=1
