[platformio]
default_envs = tx, rx

[env]
platform = espressif32 @ 8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; Reuse the tested E22 UART/AUX configuration from the transmitter firmware.
build_flags = -I../../avionics/firmware/include
build_src_filter = +<*> -<config.cpp>

[env:tx]
build_flags = ${env.build_flags} -DE22_TEST_TRANSMITTER=1

[env:rx]
build_flags = ${env.build_flags} -DE22_TEST_TRANSMITTER=0

[env:config]
build_flags = ${env.build_flags}
build_src_filter = -<*> +<config.cpp>

[env:setup]
build_flags = ${env.build_flags} -DE22_WRITE_SETUP=1
build_src_filter = -<*> +<config.cpp>
