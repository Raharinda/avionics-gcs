[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32 @ 8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; Ebyte E32-433T30D receiver, UART 9600 8N1.
; docs/gpioesp32.jpeg: M0=GPIO25, M1=GPIO26, AUX=GPIO27.
; Jika AUX tidak disambungkan, aktifkan:
; build_flags = -DE32_AUX_PIN=-1

; Tes kabel GPIO17 TX -> GPIO16 RX, tanpa modul/AUX.
[env:uart_direct]
extends = env:esp32dev
build_flags =
    -DE32_AUX_PIN=-1
    -DUART_DIRECT_TEST=1

; Setup parameter E32 tersimpan lewat ESP32.
[env:e32_setup]
extends = env:esp32dev
build_src_filter = -<*> +<e32_setup.cpp>
build_flags =
    -DE32_AUX_PIN=27
    -DE32_SETUP_BUILD=1
